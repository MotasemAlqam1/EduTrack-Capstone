<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EduTrack – Sign in</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="css/main.css" rel="stylesheet" />
  </head>
  <body>
    <div class="auth">
      <section class="auth-side">
        <a class="brand mb-0" href="index.html"
          ><span class="brand-mark"><i class="bi bi-mortarboard-fill"></i></span
          >EduTrack</a
        >
        <div>
          <h2>Know how every student is doing.</h2>
          <p class="mt-3 mb-0" style="max-width: 40ch">
            Record grades and attendance, spot students who need help early, and
            export reports for your class.
          </p>
        </div>
        <small>For instructors, university lecturers and trainers</small>
      </section>
      <section class="auth-form">
        <div class="inner">
          <h1 class="h3 fw-bold">Sign in</h1>
          <p class="text-muted">Enter your details to open your dashboard.</p>
          <form action="pages/dashboard.html">
            <div class="mb-3">
              <label class="form-label" for="email">Email</label
              ><input
                id="email"
                name="email"
                type="email"
                class="form-control"
                placeholder="you@university.edu"
                required
                autocomplete="email"
              />
            </div>
            <div class="mb-3">
              <label class="form-label" for="pw">Password</label
              ><input
                id="pw"
                name="password"
                type="password"
                class="form-control"
                minlength="6"
                required
                autocomplete="current-password"
              />
            </div>
            <button class="btn btn-green" type="submit">Sign in</button>
          </form>
        </div>
      </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
