<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EduTrack – Resources</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="../css/main.css" rel="stylesheet" />
    <link href="../css/modal.css" rel="stylesheet" />
    <script>
      document.documentElement.setAttribute(
        "data-theme",
        localStorage.getItem("theme") || "light",
      );
    </script>
    <style>
      .res-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .res-thumb {
        height: 150px;
        background: var(--g1);
        color: var(--g5);
        display: grid;
        place-items: center;
        font-size: 2.6rem;
      }
      .res-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .res-body {
        padding: 1rem;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }
      .res-body h3 {
        font-size: 1rem;
        font-weight: 600;
        margin: 0;
      }
      .res-foot {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin-top: auto;
        padding-top: 0.5rem;
      }
      .result-item {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        padding: 0.5rem;
        border: 1px solid var(--line);
        border-radius: 12px;
        cursor: pointer;
        background: var(--surface);
        width: 100%;
        text-align: left;
      }
      .result-item:hover {
        border-color: var(--g5);
      }
      .result-item img {
        width: 64px;
        height: 44px;
        object-fit: cover;
        border-radius: 8px;
        flex: none;
        background: var(--g1);
      }
      .student-modal select.form-select {
        height: 60px;
        border-radius: 14px;
        background-color: var(--sm-field-bg);
        border: 1px solid var(--sm-field-border);
        font-size: 1.1rem;
      }
    </style>
  </head>
  <body>
    <input type="checkbox" id="navToggle" class="d-none" aria-hidden="true" />
    <div class="layout">
      <aside
        class="sidebar offcanvas-lg offcanvas-start"
        id="sidebar"
        tabindex="-1"
      >
        <div class="d-flex justify-content-between align-items-start">
          <a href="dashboard.html" class="brand">
            <img
              class="brand-logo theme-logo"
              src="../images/light mode.png"
              data-light-src="../images/light mode.png"
              data-dark-src="../images/dark mode.png"
              alt="EduTrack"
            />
            <span>EduTrack</span>
          </a>
          <button
            class="btn-close btn-close-white d-lg-none"
            data-bs-dismiss="offcanvas"
            aria-label="Close"
          ></button>
        </div>
        <nav class="nav flex-column gap-1">
          <a class="nav-link" href="dashboard.html">
            <i class="bi bi-grid-1x2-fill"></i>
            Dashboard
          </a>

          <a class="nav-link" href="students.html">
            <i class="bi bi-people"></i>
            Students
          </a>
          <!-- <a class="nav-link" href="assessments.html?new=true"><i class="bi bi-plus-lg"></i>New student</a> -->

          <a class="nav-link" href="assessments.html"
            ><i class="bi bi-clipboard-check"></i>Assessments</a
          >
          <a class="nav-link" href="assessments.html?new=true"
            ><i class="bi bi-plus-lg"></i>New assessment</a
          >
          <a class="nav-link" href="courses.html">
            <i class="bi bi-book"></i>

            Courses
          </a>
          <a class="nav-link active" href="resources.html">
            <i class="bi bi-book"></i>
            Resources
          </a>
        </nav>
        <nav class="nav flex-column bottom">
          <a class="nav-link" href="../index.html"
            ><i class="bi bi-box-arrow-left"></i>Log out</a
          >
        </nav>
      </aside>

      <div class="content">
        <header class="topbar">
          <button
            class="icon-btn d-lg-none"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#sidebar"
            aria-label="Open menu"
          >
            <i class="bi bi-list fs-5"></i>
          </button>
          <label
            for="navToggle"
            class="icon-btn d-none d-lg-grid"
            style="place-items: center; cursor: pointer"
            aria-label="Toggle menu"
            ><i class="bi bi-list fs-5"></i
          ></label>
          <h1 class="me-auto">Resources</h1>
          <button
            class="icon-btn"
            id="themeToggle"
            type="button"
            aria-label="Change theme"
          >
            <i class="bi bi-moon-fill" id="themeIcon"></i>
          </button>
          <div class="dropdown">
            <button
              class="avatar"
              id="topAvatar"
              data-bs-toggle="dropdown"
              aria-label="Profile menu"
            ></button>

            <div class="dropdown-menu dropdown-menu-end p-3 shadow border-0 dd">
              <div class="d-flex gap-3 align-items-center mb-2">
                <span class="avatar avatar-lg" id="dropdownAvatar"></span>

                <div>
                  <b id="dropdownName"></b>

                  <div class="small text-muted" id="dropdownDepartment"></div>

                  <div class="small text-muted" id="dropdownEmail"></div>
                </div>
              </div>

              <hr class="my-2" />

              <a
                class="dropdown-item rounded"
                href="#"
                data-bs-toggle="modal"
                data-bs-target="#profileModal"
              >
                <i class="bi bi-person me-2"></i>

                My profile
              </a>

              <a
                class="dropdown-item rounded"
                href="#"
                data-bs-toggle="modal"
                data-bs-target="#changePasswordModal"
              >
                <i class="bi bi-lock me-2"></i>
                Change password
              </a>
              <a
                class="dropdown-item rounded text-danger"
                href="#"
                id="logoutBtn"
              >
                <i class="bi bi-box-arrow-right me-2"></i>

                Log out
              </a>
            </div>
          </div>
        </header>

        <main class="p-3 p-lg-4">
          <div
            class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"
          >
            <p class="text-muted mb-0">Videos and PDFs for your courses.</p>
            <button class="btn btn-green px-3" id="addBtn">
              <i class="bi bi-plus-lg me-1"></i>Add resource
            </button>
          </div>

          <div class="nav-tabs-x mb-3">
            <button class="btn active" data-type="">All</button>
            <button class="btn" data-type="video">Videos</button>
            <button class="btn" data-type="pdf">PDFs</button>
            <select
              id="filterCourse"
              class="form-select form-select-sm w-auto ms-auto"
              aria-label="Filter by course"
            ></select>
          </div>

          <div class="row g-3" id="resources-list"></div>
        </main>
      </div>
    </div>

    <div
      class="modal fade"
      id="resourceModal"
      tabindex="-1"
      aria-labelledby="resourceTitle"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content student-modal">
          <form id="resourceForm" class="d-flex flex-column overflow-hidden">
            <div class="modal-header">
              <h2 class="modal-title" id="resourceTitle">Add Resource</h2>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <div class="row g-4">
                <div class="col-md-6">
                  <label class="form-label" for="r-course">Course</label>
                  <select
                    id="r-course"
                    name="course"
                    class="form-select"
                    required
                  ></select>
                </div>
                <div class="col-md-6">
                  <label class="form-label" id="type-label">Type</label>
                  <div
                    class="status-toggle"
                    role="radiogroup"
                    aria-labelledby="type-label"
                  >
                    <input
                      type="radio"
                      class="btn-check"
                      name="type"
                      id="type-video"
                      value="video"
                      checked
                    />
                    <label class="status-option" for="type-video">Video</label>
                    <input
                      type="radio"
                      class="btn-check"
                      name="type"
                      id="type-pdf"
                      value="pdf"
                    />
                    <label class="status-option" for="type-pdf">PDF</label>
                  </div>
                </div>
                <div class="col-12">
                  <label class="form-label" for="r-topic">Topic</label>
                  <div class="d-flex gap-2">
                    <input
                      id="r-topic"
                      name="topic"
                      type="text"
                      class="form-control"
                      placeholder="e.g. Closures"
                      required
                    />
                    <button
                      type="button"
                      class="btn btn-add"
                      id="searchBtn"
                      style="flex: none; width: 130px"
                    >
                      Search
                    </button>
                  </div>
                </div>
                <div class="col-12" id="results" hidden></div>
                <div class="col-12">
                  <label class="form-label" for="r-title">Title</label>
                  <input
                    id="r-title"
                    name="title"
                    type="text"
                    class="form-control"
                    required
                  />
                </div>
                <div class="col-12">
                  <label class="form-label" for="r-link">Link</label>
                  <input
                    id="r-link"
                    name="link"
                    type="url"
                    class="form-control"
                    placeholder="https://..."
                    required
                  />
                </div>
                <input type="hidden" id="r-thumb" name="thumbnail" />
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-cancel"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-add" id="submitBtn">
                Add Resource
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- ================= PROFILE MODAL ================= -->

    <div
      class="modal fade"
      id="profileModal"
      tabindex="-1"
      aria-labelledby="profileTitle"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <form id="profileForm">
            <!-- HEADER -->
            <div class="modal-header border-0">
              <h2 class="modal-title h5 fw-bold" id="profileTitle">
                My profile
              </h2>

              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>

            <!-- BODY -->
            <div class="modal-body">
              <!-- PROFILE IMAGE -->
              <div class="d-flex align-items-center gap-3 mb-4">
                <span
                  class="avatar profile-avatar-preview"
                  id="profileAvatar"
                ></span>

                <div>
                  <label
                    for="profileImageInput"
                    class="btn btn-outline-success btn-sm mb-1"
                  >
                    <i class="bi bi-camera me-1"></i>
                    Choose photo
                  </label>

                  <input
                    type="file"
                    id="profileImageInput"
                    accept="image/*"
                    class="d-none"
                  />

                  <div class="small text-muted">JPG, PNG or WEBP</div>
                </div>
              </div>

              <div class="row g-3">
                <!-- NAME -->
                <div class="col-12">
                  <label class="form-label" for="p-name"> Full name </label>

                  <input id="p-name" class="form-control" required />
                </div>

                <!-- DEPARTMENT -->
                <div class="col-12">
                  <label class="form-label" for="p-dept">
                    Department / subject
                  </label>

                  <input id="p-dept" class="form-control" required />
                </div>

                <!-- PHONE -->
                <div class="col-12">
                  <label class="form-label" for="p-phone"> Phone number </label>

                  <input
                    id="p-phone"
                    type="tel"
                    class="form-control"
                    placeholder="+962 7X XXX XXXX"
                    required
                  />
                </div>

                <!-- EMAIL -->
                <div class="col-12">
                  <label class="form-label" for="p-email">
                    Sign-in email
                  </label>

                  <input
                    id="p-email"
                    type="email"
                    class="form-control"
                    readonly
                  />
                </div>
              </div>
            </div>

            <!-- FOOTER -->
            <div class="modal-footer border-0">
              <button
                type="button"
                class="btn btn-light"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>

              <button type="submit" class="btn btn-green">Save profile</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- CHANGE PASSWORD MODAL -->
    <div class="modal fade" id="changePasswordModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <form id="changePasswordForm">
            <div class="modal-header border-0">
              <h2 class="modal-title h5 fw-bold">Change password</h2>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>

            <div class="modal-body">
              <div class="mb-3">
                <label class="form-label" for="currentPassword">
                  Current password
                </label>

                <div class="password-field">
                  <input
                    id="currentPassword"
                    type="password"
                    class="form-control"
                    required
                  />

                  <button
                    type="button"
                    class="toggle-password"
                    data-target="currentPassword"
                  >
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label" for="newPassword">
                  New password
                </label>

                <div class="password-field">
                  <input
                    id="newPassword"
                    type="password"
                    class="form-control"
                    minlength="6"
                    required
                  />

                  <button
                    type="button"
                    class="toggle-password"
                    data-target="newPassword"
                  >
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label" for="confirmNewPassword">
                  Confirm new password
                </label>

                <div class="password-field">
                  <input
                    id="confirmNewPassword"
                    type="password"
                    class="form-control"
                    minlength="6"
                    required
                  />

                  <button
                    type="button"
                    class="toggle-password"
                    data-target="confirmNewPassword"
                  >
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>
            </div>

            <div class="modal-footer border-0">
              <button
                type="button"
                class="btn btn-light"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-green">
                Change password
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="../js/profile.js"></script>
    <script src="../js/passwordToggle.js"></script>
    <script src="../js/theme.js"></script>
    <script type="module" src="../js/resources.js"></script>
  </body>
</html>
