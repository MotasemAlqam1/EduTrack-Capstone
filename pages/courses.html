<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>EduTrack – Courses</title>


    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">


    <!-- Outfit Font -->

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">


    <!-- Main Theme -->

    <link href="../css/main.css" rel="stylesheet">
    <!-- Courses CSS -->

    <link href="../css/courses.css" rel="stylesheet">
    <a class="nav-link" href="resources.html">
        <i class="bi bi-collection-play"></i>Resources</a>

</head>


<body>


    <!-- Desktop sidebar toggle -->

    <input type="checkbox" id="navToggle" class="d-none" aria-hidden="true">


    <div class="layout">


        <!-- ==================================================
             SIDEBAR
        ================================================== -->

        <aside class="sidebar offcanvas-lg offcanvas-start" id="sidebar" tabindex="-1">

            <div class="d-flex justify-content-between align-items-start">

                <a href="dashboard.html" class="brand">

                    <span class="brand-mark">

                        <i class="bi bi-mortarboard-fill"></i>

                    </span>

                    EduTrack

                </a>


                <button class="btn-close btn-close-white d-lg-none" data-bs-dismiss="offcanvas"
                    aria-label="Close"></button>

            </div>


            <nav class="nav flex-column gap-1">


                <a class="nav-link" href="dashboard.html">

                    <i class="bi bi-grid-1x2-fill"></i>

                    Dashboard

                </a>


                <a class="nav-link" href="students.html">

                    <i class="bi bi-people"></i>

                    Students

                </a>


                <a class="nav-link active" href="courses.html">

                    <i class="bi bi-book"></i>

                    Courses

                </a>

            </nav>


            <nav class="nav flex-column bottom">

                <a class="nav-link" href="../index.html">

                    <i class="bi bi-box-arrow-left"></i>

                    Log out

                </a>

            </nav>

        </aside>


        <!-- ==================================================
             CONTENT
        ================================================== -->

        <div class="content">


            <!-- ==================================================
                 TOPBAR
            ================================================== -->

            <header class="topbar">


                <!-- Mobile menu -->

                <button class="icon-btn d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar"
                    aria-label="Open menu">

                    <i class="bi bi-list fs-5"></i>

                </button>


                <!-- Desktop menu -->

                <label for="navToggle" class="icon-btn d-none d-lg-grid" style="place-items: center; cursor: pointer"
                    aria-label="Toggle menu">

                    <i class="bi bi-list fs-5"></i>

                </label>


                <h1 class="me-auto">

                    Courses

                </h1>


                <!-- Search -->

                <form class="search" role="search" onsubmit="return false;">

                    <i class="bi bi-search"></i>


                    <input class="form-control" type="search" id="searchInput" placeholder="Search courses"
                        aria-label="Search courses">

                </form>


                <!-- Profile -->

                <div class="dropdown">


                    <button class="avatar" data-bs-toggle="dropdown" aria-label="Profile menu">

                        AM

                    </button>


                    <div class="dropdown-menu dropdown-menu-end p-3 shadow border-0 dd">

                        <div class="d-flex gap-3 align-items-center mb-2">

                            <span class="avatar avatar-lg">

                                AM

                            </span>


                            <div>

                                <b>
                                    Dr. Ahmad Mohammad
                                </b>


                                <div class="small text-muted">

                                    Instructor · Computer Science

                                </div>


                                <div class="small text-muted">

                                    demo@edutrack.com

                                </div>

                            </div>

                        </div>


                        <hr class="my-2">


                        <a class="dropdown-item rounded" href="#">

                            <i class="bi bi-person me-2"></i>

                            My profile

                        </a>


                        <a class="dropdown-item rounded text-danger" href="../index.html">

                            <i class="bi bi-box-arrow-right me-2"></i>

                            Log out

                        </a>

                    </div>

                </div>

            </header>


            <!-- ==================================================
                 MAIN
            ================================================== -->

            <main class="p-3 p-lg-4">


                <!-- Page Header -->

                <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">

                    <div>

                        <h2 class="h4 fw-bold mb-1">
                            Courses
                        </h2>

                        <p class="text-muted mb-0">
                            Manage your courses.
                        </p>

                    </div>


                    <button type="button" class="btn btn-green" id="addCourseBtn">

                        <i class="bi bi-plus-lg me-1"></i>

                        Add Course

                    </button>

                </div>


                <!-- ==================================================
                     COURSE FORM
                ================================================== -->

                <div id="courseFormContainer" class="course-form-container mb-4" style="display: none;">

                    <div class="course-form-card">


                        <div class="mb-3">

                            <h3 class="h5 fw-bold mb-1" id="courseFormTitle">

                                Add Course

                            </h3>

                            <p class="text-muted mb-0">

                                Enter the course information.

                            </p>

                        </div>


                        <form id="courseForm">


                            <div class="row g-3">


                                <!-- Course Name -->

                                <div class="col-12 col-md-6">

                                    <label for="courseName" class="form-label">

                                        Course Name

                                    </label>


                                    <input type="text" id="courseName" class="form-control" placeholder="Course Name">

                                </div>


                                <!-- Category -->

                                <div class="col-12 col-md-6">

                                    <label for="courseCategory" class="form-label">

                                        Category

                                    </label>


                                    <input type="text" id="courseCategory" class="form-control" placeholder="Category">

                                </div>


                                <!-- Description -->

                                <div class="col-12">

                                    <label for="courseDescription" class="form-label">

                                        Description

                                    </label>


                                    <textarea id="courseDescription" class="form-control" rows="3"
                                        placeholder="Course Description"></textarea>

                                </div>


                                <!-- Buttons -->

                                <div class="col-12 d-flex gap-2 justify-content-end">

                                    <button type="button" id="cancelCourseBtn" class="btn btn-outline-secondary">

                                        Cancel

                                    </button>


                                    <button type="submit" id="submitCourseBtn" class="btn btn-green">

                                        Add Course

                                    </button>

                                </div>

                            </div>

                        </form>

                    </div>

                </div>


                <!-- ==================================================
                     COURSES
                ================================================== -->

                <div id="coursesContainer" class="row g-4"></div>


                <!-- ==================================================
                     NO RESULTS
                ================================================== -->

                <div id="noCoursesMessage" class="text-center py-5" style="display: none;">

                    <i class="bi bi-search fs-1 text-muted"></i>


                    <h3 class="h5 mt-3">
                        No courses found
                    </h3>


                    <p class="text-muted">
                        Try another search term.
                    </p>

                </div>

            </main>

        </div>

    </div>


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <!-- Courses JS -->

    <script src="../js/courses.js"></script>


</body>

</html>
